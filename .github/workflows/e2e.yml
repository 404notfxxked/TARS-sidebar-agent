# E2E:verify-*/probe-* 断言套件驱动真实 Chrome + 扩展(CDP 层 mock 网络)。
# headful 扩展流,xvfb-run 包裹;实网探针(real-search-probe)不在套件内,
# 不会在 CI 发真实搜索请求。按需手动触发,不在 push/PR 常跑(全量约 10 分钟)。
name: e2e

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "要跑的域(run.mjs 域名,如 memory / web-search;留空 = 全量 --all)"
        required: false
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # verify-interact 用 esbuild 注入 harness;其余套件加载 dist 扩展
      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium(含系统依赖)
        run: pnpm exec playwright install --with-deps chromium

      # 断言多为 DOM 层不依赖字形,但截图产物里的中文需要 CJK 字体
      - name: Install CJK fonts(截图可读)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run e2e suites
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          if [ -n "$DOMAIN" ]; then
            xvfb-run -a node tests/run.mjs "$DOMAIN"
          else
            xvfb-run -a node tests/run.mjs --all
          fi

      - name: Upload screenshots(视觉留档)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tars-m3-shots
          path: /tmp/tars-m3
          if-no-files-found: ignore
