# E2E 工作流:verify-*/probe-* 断言套件驱动真实 Chrome + 扩展(CDP 层 mock
# 网络)。基础概念(runner/action/step、装 pnpm/Node 的三步、失败语义)见
# checks.yml 头注,这里只讲本文件独有的东西。
#
# 与 checks 的分工:e2e 要起 headful(带界面)浏览器跑真扩展流,单次约
# 10 分钟——不适合每次 push 都跑。触发器两个:
#   ① workflow_dispatch 手动(仓库页 → Actions → 左侧选 e2e → Run
#      workflow),inputs 会变成页面上让你填的表单;
#   ② schedule nightly(UTC 19:00 = 北京 03:00,低峰时段)——慢套件纯
#      手动意味着坏了要等下次想起来跑才发现,夜间全量让断裂最长 24h
#      内暴露;失败时自动开 issue(见末尾 step),手动跑不开免得刷屏。
name: e2e

on:
  schedule:
    # 每天 UTC 19:00(北京 03:00);GitHub schedule 用的是 UTC,不是本地时区
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "要跑的域(run.mjs 域名,如 memory / web-search;留空 = 全量 --all)"
        required: false
        default: ""

# nightly 失败自动开 issue 需要 issues 写权限
permissions:
  issues: write
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 整个 job 的保险丝:哪怕浏览器僵死挂住,最多烧 45 分钟就强制终止,
    # 不会无限吃私有仓库的按分钟计费额度
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # 版本不写死,读 package.json 的 packageManager(理由见 checks.yml)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # verify-interact 用 esbuild 注入 harness;其余套件加载 dist 扩展
      - name: Build
        run: pnpm build

      # 装 Playwright 管理的 Chromium;--with-deps 顺带补 Ubuntu 缺的系统
      # 库(不装浏览器起不来)。本地早已装过所以无感,全新 runner 必须现装。
      - name: Install Playwright Chromium(含系统依赖)
        run: pnpm exec playwright install --with-deps chromium

      # runner 默认没有中文字体。断言多在 DOM 层不依赖字形,但失败时上传
      # 的截图里中文会变成「豆腐块」,装 Noto CJK 保证截图可读。
      - name: Install CJK fonts(截图可读)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      # runner 是无显示器的机器,headful Chrome 需要 X 服务:xvfb-run 包一层
      # = 在虚拟帧缓冲(内存里的假显示器)里跑。本地等价命令:
      #   xvfb-run -a node tests/run.mjs <域>
      - name: Run e2e suites
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          if [ -n "$DOMAIN" ]; then
            xvfb-run -a node tests/run.mjs "$DOMAIN"
          else
            xvfb-run -a node tests/run.mjs --all
          fi

      # 截图产物上传成 artifact——runner 销毁后唯一能回看的东西,在该次
      # 运行详情页底部 Artifacts 区下载(默认留 90 天)。/tmp/tars-* 覆盖
      # 各探针套件各自的 OUT 目录(按套件现取:grep -rn "/tmp/tars-" tests/),
      # glob 命中多个目录时 artifact 内按目录名分桶。名字沿用 tars-m3-shots
      # (历史叫法,内容已不止 m3)。if: always() = 前面步骤失败也执行:
      # 失败现场的截图恰恰最有价值。
      - name: Upload screenshots(视觉留档)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tars-m3-shots
          path: /tmp/tars-*
          if-no-files-found: ignore

      # nightly 失败自动开 issue:断裂在 24h 内暴露还要有人被通知才算数。
      # 只在 schedule 触发的失败时开(手动跑失败是开发者本人在场,自己看);
      # 已有未关闭的同名 issue 就跳过(--search),避免 nightly 连坏多日刷屏。
      - name: Open issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="e2e nightly 失败:$(date -u +%F) run #${{ github.run_id }}"
          EXISTS=$(gh issue list --state open --search "e2e nightly 失败" --json number --jq length)
          if [ "$EXISTS" -gt 0 ]; then
            echo "已有未关闭的 nightly 失败 issue,跳过新建"
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "夜间全量 e2e 失败。运行详情:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          截图 artifact 在该 run 页面底部(tars-m3-shots)。先看汇总里哪个域红,再按域本地复跑:
          \`xvfb-run -a node tests/run.mjs <域>\`"
